<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KYC Operations Console</title>
<style>
  :root {
    --surface: #fcfcfb; --page: #f4f5f8; --ink: #1f2933; --ink-2: #52514e; --muted: #7b8290; --line: #e4e7eb; --grid: #eceef2;
    --series: #2a78d6; --series-soft: #cde2fb;
    --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --other: #b9bcc4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", Inter, sans-serif; color: var(--ink); background: var(--page); }
  header { background: #1f2933; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  header b { font-weight: 600; } header small { opacity: .75; }
  .mode { font-size: 12px; padding: 3px 10px; border-radius: 12px; background: rgba(255,255,255,.1); display: inline-flex; gap: 6px; align-items: center; }
  .mode i { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); }
  .mode.live i { background: #22c55e; }
  .bar { max-width: 1160px; margin: 0 auto; padding: 16px 16px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; background: #e6e8ee; padding: 3px; border-radius: 8px; }
  .tabs button { border: 0; background: none; padding: 6px 14px; border-radius: 6px; font: 500 13px inherit; font-family: inherit; color: var(--ink-2); cursor: pointer; }
  .tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  select { font: inherit; padding: 6px 10px; border: 1px solid #cfd6dd; border-radius: 6px; background: #fff; }
  .spacer { flex: 1; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 16px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; }
  @media (max-width: 860px) { .grid2, .split { grid-template-columns: 1fr; } }
  .box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .box h3 { margin: 0; padding: 12px 14px 0; font-size: 14px; font-weight: 600; }
  .box .cap { padding: 2px 14px 0; font-size: 12.5px; color: var(--muted); }
  .box .plot { padding: 10px 14px 14px; position: relative; }
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .kpi span { font-size: 12.5px; color: var(--muted); }
  .kpi b { display: block; font-size: 26px; font-weight: 600; letter-spacing: -.01em; margin-top: 2px; }
  .kpi small { font-size: 12px; color: var(--ink-2); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); padding: 8px 14px 0; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .hrow { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 44px; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; }
  .hrow .lab { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hrow .track { height: 10px; background: transparent; position: relative; }
  .hrow .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--series); min-width: 2px; }
  .hrow .val { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .stack { display: flex; height: 10px; gap: 2px; }
  .stack span { display: block; height: 100%; }
  .stack span:last-child { border-radius: 0 4px 4px 0; }
  .empty { color: var(--muted); font-size: 13px; padding: 18px 0; text-align: center; }
  svg text { font-size: 11px; fill: var(--muted); }
  .tip { position: fixed; pointer-events: none; background: #1f2933; color: #fff; font-size: 12.5px; padding: 8px 10px; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.2); z-index: 50; max-width: 260px; }
  .tip b { display: block; margin-bottom: 2px; }
  details { padding: 0 14px 12px; font-size: 12.5px; color: var(--ink-2); }
  details table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  details td, details th { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--grid); font-weight: 400; }
  /* applications tab */
  table.apps { width: 100%; border-collapse: collapse; } table.apps td { padding: 10px 14px; border-bottom: 1px solid #f0f2f4; vertical-align: top; }
  tr.r { cursor: pointer; } tr.r:hover, tr.r.on { background: #f3f7fc; }
  .b { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
  .APPROVE { background: #e8f5e9; color: #1b6b1b; } .REVIEW { background: #fff4e0; color: #8a5a00; } .REJECT { background: #fdecea; color: #a12a2a; } .processing, .error { background: #eceff1; color: var(--muted); }
  .d { padding: 14px; } .d dl { display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; margin: 0 0 12px; } .d dt { color: var(--muted); } .d dd { margin: 0; }
  .meter { height: 6px; background: #eef1f4; border-radius: 3px; overflow: hidden; } .meter i { display: block; height: 100%; background: var(--series); }
  .gate { max-width: 360px; margin: 80px auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 24px; }
  .gate input { width: 100%; padding: 10px; border: 1px solid #cfd6dd; border-radius: 4px; font: inherit; }
  .gate button { margin-top: 12px; padding: 10px 16px; background: #1f2933; color: #fff; border: 0; border-radius: 4px; font: inherit; cursor: pointer; }
  .muted { color: var(--muted); } .chk { display: inline-block; margin: 2px 6px 2px 0; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #eef4ee; color: #1b6b1b; }
  .chk.no { background: #f4eeee; color: #a12a2a; } .chk.na { background: #eef0f3; color: var(--muted); }
</style>
</head>
<body>
<header><div><b id="pname">KYC Operations</b> <small>· verification by TrueID Shield</small></div><span class="mode" id="mode"><i></i><span>Checking…</span></span></header>
<div id="root"></div>
<div class="tip" id="tip" hidden></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const pct = (x) => (x == null ? "—" : `${Math.round(x * 100)}%`);
const DEC = { APPROVE: ["Approved", "var(--good)", "✓"], REVIEW: ["In review", "var(--warning)", "!"], REJECT: ["Rejected", "var(--critical)", "✕"] };
const CHECK_NAMES = { mobile_otp: "Mobile OTP", email_otp: "Email OTP", pan_nsdl: "PAN (Income Tax)", digilocker_aadhaar: "Aadhaar via DigiLocker",
  webcam_ipv: "Live webcam photo", location: "Location", signature: "Signature", pan_card_upload: "PAN card photo", esign: "Aadhaar eSign",
  aadhaar_ekyc_otp: "Aadhaar e-KYC OTP", ckyc_otp: "CKYC OTP", ovd_upload: "Document upload", selfie_upload: "Selfie upload", vkyc_consent: "Video KYC consent",
  liveness_challenge: "Head-turn challenge", consent_kyc: "KYC consent", consent_bureau: "Bureau consent", pan_format: "PAN format", pan_dob: "PAN date of birth",
  pan_name: "PAN name", aadhaar_valid: "Aadhaar checksum & record", aadhaar_ekyc: "Aadhaar e-KYC", name_pan_aadhaar: "Name: PAN = Aadhaar",
  dob_pan_aadhaar: "DOB: PAN = Aadhaar", pan_aadhaar_linked: "PAN linked to Aadhaar", doc_signature: "Card QR signature", doc_consistency: "Card QR = print",
  form_consistency: "Card = Aadhaar details", id_format: "ID checksum", live_capture: "Live capture", virtual_camera: "No virtual camera",
  bill_recent: "Bill under 2 months", bill_name: "Bill name", bill_pin: "Bill PIN", slip_recent: "Slip under 3 months", slip_name: "Slip name",
  slip_employer: "Slip employer", slip_net_pay: "Slip net pay", statement_name: "Statement name", salary_credit: "Salary credit = slip",
  ifsc_format: "IFSC valid", cheque_name: "Cheque name", account_matches_statement: "Cheque = statement account", penny_drop: "Penny drop",
  affordability: "Affordability (FOIR)", legible: "Legible", ai_marker: "No AI marker", editor_tag: "No editing software", reuse: "Not reused",
  text_name: "Name printed", text_consumer_no: "Consumer no printed", text_bill_date: "Bill date printed", text_pincode: "PIN printed",
  text_employer: "Employer printed", text_net_pay: "Net pay printed", text_account_no: "Account no printed", text_salary_credit: "Salary credit printed",
  text_ifsc: "IFSC printed" };
const ss = { get: (k) => { try { return sessionStorage.getItem(k) || ""; } catch { return ""; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} } };
let pass = ss.get("ops"), tab = ss.get("tab") || "analytics", days = +(ss.get("days") || 14), sel = null, apps = [], stats = null;
const api = (p) => fetch(p, { headers: { "X-Ops-Passcode": pass } }).then(async (r) => ({ s: r.status, j: await r.json() }));

// ---------- hover tooltip ----------
const tip = $("#tip");
document.addEventListener("mousemove", (e) => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.hidden = true; return; }
  tip.innerHTML = t.dataset.tip; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 14) + "px";
  tip.style.top = Math.max(8, e.clientY - h - 12) + "px";
});

fetch("/api/mode").then((r) => r.json()).then((m) => {
  $("#pname").textContent = m.partner + " · KYC Operations"; document.title = m.partner + " Ops";
  $("#mode").classList.toggle("live", m.mode === "remote");
  $("#mode span").textContent = m.mode === "remote" ? `Connected to TrueID Shield (${m.backend})` : "Demo mode · TrueID backend not connected";
});

function gate(msg = "") {
  $("#root").innerHTML = `<div class="gate"><b>Operations sign-in</b><p class="muted">Enter the ops passcode (see the README).</p>
    <input id="pc" type="password" placeholder="Passcode"><div style="color:#a12a2a;font-size:13px;margin-top:6px">${esc(msg)}</div><button id="go">Open console</button></div>`;
  $("#pc").focus();
  $("#pc").onkeydown = (e) => { if (e.key === "Enter") $("#go").click(); };
  $("#go").onclick = () => { pass = $("#pc").value; ss.set("ops", pass); load(); };
}

async function load() {
  const [a, l] = await Promise.all([api(`/api/ops/analytics?days=${days}`), api("/api/ops/applications")]);
  if (a.s === 401 || l.s === 401) return gate(pass ? "Wrong passcode." : "");
  stats = a.j; apps = l.j.applications || [];
  draw();
}

function draw() {
  $("#root").innerHTML = `<div class="bar"><div class="tabs"><button data-t="analytics" class="${tab === "analytics" ? "on" : ""}">Analytics</button><button data-t="apps" class="${tab === "apps" ? "on" : ""}">Applications (${apps.length})</button></div>
    <span class="spacer"></span>${tab === "analytics" ? `<select id="days" aria-label="Date range">${[7, 14, 30, 90].map((d) => `<option value="${d}" ${d === days ? "selected" : ""}>Last ${d} days</option>`).join("")}</select>` : ""}</div>
    <div class="wrap" id="body"></div>`;
  document.querySelectorAll(".tabs button").forEach((b) => (b.onclick = () => { tab = b.dataset.t; ss.set("tab", tab); draw(); }));
  $("#days") && ($("#days").onchange = (e) => { days = +e.target.value; ss.set("days", days); load(); });
  tab === "analytics" ? drawAnalytics() : drawApps();
}

// ---------- analytics ----------
function drawAnalytics() {
  const a = stats;
  if (!a || a.detail) return ($("#body").innerHTML = `<div class="box"><div class="d">Analytics unavailable: ${esc(a?.detail || "no data")}</div></div>`);
  const d = a.decisions;
  $("#body").innerHTML = `
    <div class="kpis">
      ${kpi("Applications", a.submitted, a.processing ? `${a.processing} still being checked` : `last ${a.days} days`)}
      ${kpi("Approval rate", pct(a.approval_rate), `${d.APPROVE} approved automatically`)}
      ${kpi("In review", d.REVIEW, "need a person to check")}
      ${kpi("Rejected", d.REJECT, `${a.fraud_flagged} tied to a fraud pattern`)}
      ${kpi("Average risk", a.risk.mean == null ? "—" : a.risk.mean.toFixed(2), `model score, ${a.risk.n} cases`)}
    </div>
    <div class="box" style="margin-bottom:16px"><h3>Decisions per day</h3><p class="cap">What TrueID decided for each day's applications</p>
      <div class="legend">${Object.values(DEC).map(([n, c, ic]) => `<span><i style="background:${c}"></i>${ic} ${n}</span>`).join("")}</div>
      <div class="plot" id="daily"></div>${table(["Date", "Approved", "In review", "Rejected"], a.daily.map((x) => [x.date, x.APPROVE, x.REVIEW, x.REJECT]))}</div>
    <div class="grid2" style="margin-bottom:16px">
      <div class="box"><h3>Fraud patterns</h3><p class="cap">The pattern TrueID matched, per case</p><div class="plot">${hbars(a.fraud_patterns.map((f) => [f.label, f.count]), "cases")}</div></div>
      <div class="box"><h3>Top reasons</h3><p class="cap">Most frequent risk signals behind the decisions</p><div class="plot">${hbars(a.top_reasons.map((r) => [r.text, r.count, r.code]), "cases")}</div></div>
    </div>
    <div class="split" style="margin-bottom:16px">
      <div class="box"><h3>Risk distribution</h3><p class="cap">Applications by model risk score (0 = clean, 1 = fraud)</p><div class="plot" id="hist"></div></div>
      <div class="box"><h3>TrueID checks</h3><p class="cap">How often each required check passed</p>
        ${a.checks.length ? `<div class="legend"><span><i style="background:var(--good)"></i>✓ Passed</span><span><i style="background:var(--critical)"></i>✕ Failed</span><span><i style="background:var(--other)"></i>– Not provided / unavailable</span></div>` : ""}
        <div class="plot">${checks(a.checks)}</div></div>
    </div>
    <div class="box"><h3>Checks ${esc(a.partner)} ran itself</h3><p class="cap">Share of applications where your own onboarding reported the check. These are your claims; TrueID does not count them as evidence.</p>
      <div class="plot">${hbars(Object.entries(a.partner_checks).map(([k, v]) => [CHECK_NAMES[k] || k, v]), "", true)}</div></div>`;
  dailyChart($("#daily"), a.daily);
  histChart($("#hist"), a.risk.histogram);
}
const kpi = (label, value, sub) => `<div class="kpi"><span>${label}</span><b>${value}</b><small>${esc(sub)}</small></div>`;
function table(head, rows) {
  return `<details><summary>Show as table</summary><table><tr>${head.map((h) => `<th>${h}</th>`).join("")}</tr>${rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></details>`;
}
function hbars(rows, unit, asPct = false) {
  if (!rows.length) return `<div class="empty">Nothing yet in this period.</div>`;
  const max = asPct ? 1 : Math.max(...rows.map((r) => r[1]));
  return rows.map(([label, v, code]) => `<div class="hrow" data-tip="<b>${esc(label)}</b>${asPct ? pct(v) + " of applications" : `${v} ${unit}`}${code ? `<br><span style='opacity:.7'>${esc(code)}</span>` : ""}">
      <span class="lab">${esc(label)}</span><span class="track"><span class="fill" style="width:${(v / max) * 100}%"></span></span><span class="val">${asPct ? pct(v) : v}</span></div>`).join("");
}
function checks(list) {
  if (!list.length) return `<div class="empty">Per-check results come from TrueID. Connect the backend to see them.</div>`;
  return list.map((c) => {
    const n = c.PASS + c.FAIL + c.OTHER || 1;
    const seg = (k, col) => (c[k] ? `<span style="width:${(c[k] / n) * 100}%;background:${col}"></span>` : "");
    return `<div class="hrow" data-tip="<b>${esc(c.label)}</b>✓ ${c.PASS} passed · ✕ ${c.FAIL} failed · – ${c.OTHER} not provided">
      <span class="lab">${esc(c.label)}</span><span class="stack">${seg("PASS", "var(--good)")}${seg("FAIL", "var(--critical)")}${seg("OTHER", "var(--other)")}</span><span class="val">${pct(c.PASS / n)}</span></div>`;
  }).join("");
}
function dailyChart(el, rows) {
  const W = el.clientWidth || 800, H = 190, L = 28, B = 22, T = 8;
  const max = Math.max(1, ...rows.map((r) => r.APPROVE + r.REVIEW + r.REJECT));
  const step = (W - L) / rows.length, bw = Math.max(4, Math.min(34, step * 0.62));
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const ticks = [0, Math.ceil(max / 2), max];
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="Decisions per day">`;
  for (const t of ticks) s += `<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  rows.forEach((r, i) => {
    const x = L + i * step + (step - bw) / 2;
    let acc = 0;
    const parts = ["APPROVE", "REVIEW", "REJECT"].filter((k) => r[k]);
    parts.forEach((k, j) => {
      const h = (H - T - B) * (r[k] / max), top = y(acc + r[k]);
      const last = j === parts.length - 1;
      s += last ? `<path d="M${x},${top + h - 1}V${top + 4}q0,-4 4,-4h${bw - 8}q4,0 4,4V${top + h - 1}Z" fill="${DEC[k][1]}"/>`
                : `<rect x="${x}" y="${top + 1}" width="${bw}" height="${Math.max(0, h - 2)}" fill="${DEC[k][1]}"/>`;
      acc += r[k];
    });
    const total = r.APPROVE + r.REVIEW + r.REJECT;
    s += `<rect x="${L + i * step}" y="${T}" width="${step}" height="${H - T - B}" fill="transparent" data-tip="<b>${r.date}</b>✓ ${r.APPROVE} approved<br>! ${r.REVIEW} in review<br>✕ ${r.REJECT} rejected${r.processing ? `<br>${r.processing} still checking` : ""}"/>`;
    if (rows.length <= 14 || i % Math.ceil(rows.length / 10) === 0) s += `<text x="${L + i * step + step / 2}" y="${H - 6}" text-anchor="middle">${r.date.slice(5)}</text>`;
    if (total && rows.length <= 31) s += `<text x="${L + i * step + step / 2}" y="${y(total) - 4}" text-anchor="middle" style="fill:var(--ink-2)">${total}</text>`;
  });
  el.innerHTML = s + "</svg>";
}
function histChart(el, bins) {
  const W = el.clientWidth || 480, H = 170, L = 28, B = 22, T = 14;
  const max = Math.max(1, ...bins), step = (W - L) / bins.length, bw = step - 2;
  const y = (v) => T + (H - T - B) * (1 - v / max);
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="Risk distribution">`;
  for (const t of [0, max]) s += `<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  bins.forEach((v, i) => {
    const x = L + i * step + 1, top = y(v), h = H - B - top;
    if (v) s += `<path d="M${x},${H - B}V${top + 4}q0,-4 4,-4h${bw - 8}q4,0 4,4V${H - B}Z" fill="var(--series)"/>`;
    if (v) s += `<text x="${x + bw / 2}" y="${top - 4}" text-anchor="middle" style="fill:var(--ink-2)">${v}</text>`;
    s += `<rect x="${L + i * step}" y="${T}" width="${step}" height="${H - T - B}" fill="transparent" data-tip="<b>Risk ${(i / 10).toFixed(1)}–${((i + 1) / 10).toFixed(1)}</b>${v} application${v === 1 ? "" : "s"}"/>`;
  });
  s += `<text x="${L}" y="${H - 6}">0</text><text x="${L + (W - L) / 2}" y="${H - 6}" text-anchor="middle">0.5</text><text x="${W}" y="${H - 6}" text-anchor="end">1.0</text>`;
  el.innerHTML = s + "</svg>";
}

// ---------- applications ----------
function drawApps() {
  const a = apps.find((x) => x.application_id === sel);
  $("#body").innerHTML = `<div class="split"><div class="box"><h3 style="padding-bottom:10px">Applications</h3><table class="apps">${apps.map((x) => `
    <tr class="r ${x.application_id === sel ? "on" : ""}" data-id="${esc(x.application_id)}"><td><b>${esc(x.applicant?.name)}</b><br><span class="muted">${esc(x.application_id)} · ${esc(x.submitted_at)}</span></td>
    <td style="text-align:right"><span class="b ${esc(x.decision || x.status)}">${esc(x.decision || x.status)}</span><br><span class="muted">${x.risk_score != null ? "risk " + x.risk_score : ""}</span></td></tr>`).join("") || `<tr><td class="muted">No applications yet. Submit one from the KYC page.</td></tr>`}</table></div>
    <div class="box"><h3 style="padding-bottom:10px">Verdict</h3>${a ? detail(a) : `<div class="d muted">Select an application.</div>`}</div></div>`;
  document.querySelectorAll("tr.r").forEach((r) => (r.onclick = () => { sel = r.dataset.id; drawApps(); }));
}
function detail(a) {
  if (a.status !== "completed") return `<div class="d">Status: <b>${esc(a.status)}</b>${a.error ? `<p style="color:#a12a2a">${esc(a.error)}</p>` : ""}</div>`;
  const ap = a.applicant || {};
  const ev = (a.evidence || []).filter((e) => e.required);
  return `<div class="d"><p><span class="b ${esc(a.decision)}">${esc(a.decision)}</span> &nbsp;<b>${esc(a.fraud_label)}</b>${a.risk_score != null ? ` · risk ${esc(a.risk_score)}` : ""}</p>
    <p class="muted" style="margin-top:-6px">Recommended: ${esc(a.recommended_action)}</p>
    <dl><dt>Applicant</dt><dd>${esc(ap.name)} · ${esc(ap.dob)} · ${esc(ap.gender)}</dd><dt>ID / PAN</dt><dd>${esc(ap.id_number)} · ${esc(ap.pan || "—")}</dd>
    <dt>Contact</dt><dd>${esc(ap.phone)} · ${esc(ap.email)}</dd><dt>Capture</dt><dd>${esc(Object.entries(a.capture || {}).map(([k, v]) => k + ": " + v).join(", "))}</dd></dl>
    <p><b>Reasons</b></p>${(a.reasons || []).filter((r) => r.weight > 0).map((r) => `<p style="margin:4px 0">• ${esc(r.text)} <span class="muted">(${esc(r.module)}, ${esc(r.code)})</span></p>`).join("") || `<p class="muted">No risk reasons.</p>`}
    ${ev.length ? `<p style="margin-top:14px"><b>TrueID checks</b></p>${ev.map((e) => `<span class="chk ${e.status === "PASS" ? "" : e.status === "FAIL" ? "no" : "na"}">${e.status === "PASS" ? "✓" : e.status === "FAIL" ? "✕" : "–"} ${esc(e.label)}</span>`).join("")}` : ""}
    <p style="margin-top:14px"><b>Risk by area</b></p>${(a.modules || []).map((m) => `<div style="display:grid;grid-template-columns:100px 1fr 40px;gap:8px;align-items:center;margin:4px 0"><span>${esc(m.module)}</span><div class="meter"><i style="width:${Math.round(m.risk * 100)}%"></i></div><span class="muted">${Math.round(m.risk * 100)}</span></div>`).join("")}
    <p style="margin-top:14px"><b>Checks this site ran</b></p>${Object.entries(a.partner_checks || {}).map(([k, v]) => `<span class="chk ${v ? "" : "no"}">${v ? "✓" : "✕"} ${esc(CHECK_NAMES[k] || k)}</span>`).join("") || `<span class="muted">none reported</span>`}
    <p class="muted" style="margin-top:14px">${esc(a.summary || "")}</p></div>`;
}
load(); setInterval(() => pass && !document.querySelector("details[open]") && load(), 15000);
</script>
</body>
</html>
